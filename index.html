/* ── Tutorial (post-login onboarding) ── */
var TUT_DEFAULT_HASH='0a0dc53e1570ef44b7e05ff4e45b91b57541c1036d4b4cc2eb6a79223b4ce619';
var _tutEl=null,_tutStep=0,_tutSteps=[],_tutUnit=null,_tutPwChanged=false;

function shouldShowTutorial(unit){
  if(!unit)return false;
  if(!state.settings.tutorialSeen)state.settings.tutorialSeen={};
  return !state.settings.tutorialSeen[unit];
}

function showTutorial(unit,forceShow){
  _tutUnit=unit;_tutStep=0;_tutPwChanged=false;
  var isAdminMode=auth&&auth.type==='admin';
  var displayName=isAdminMode?'관리자':(unit||'');
  var isDefault=!isAdminMode&&unit&&state.settings.unitPasswords&&state.settings.unitPasswords[unit]===TUT_DEFAULT_HASH;

  _tutSteps=[];
  // Step 1: Welcome
  _tutSteps.push({
    emoji:'&#128075;',
    title:'환영합니다!',
    desc:'<strong>'+esc(displayName)+'<\/strong>님, 반갑습니다.<br>이 앱에서 매달 수도 사용량을 입력하면<br>요금이 자동으로 계산됩니다.',
    body:null
  });

  // Step 2: Password change (only if unit user with default password, not admin)
  if(isDefault&&!forceShow){
    _tutSteps.push({
      emoji:'&#128274;',
      title:'비밀번호를 변경해주세요',
      desc:'지금은 초기 비밀번호(1234)로 되어 있어요.<br>다른 사람이 접속하지 못하도록<br><strong>나만의 비밀번호<\/strong>로 바꿔주세요.',
      body:'pw'
    });
  }

  // Step 3: Usage input method
  _tutSteps.push({
    emoji:'&#128221;',
    title:'사용량 입력 방법',
    desc:'아래 순서대로 하시면 됩니다.',
    body:'usage'
  });

  // Step 4: Meter reading schedule
  _tutSteps.push({
    emoji:'&#128197;',
    title:'검침일 안내',
    desc:'<strong>매월 26일<\/strong>에 계량기 사진을 찍어주세요!',
    body:'schedule'
  });

  // Step 5: Save
  _tutSteps.push({
    emoji:'&#10004;',
    title:'자동 저장됩니다!',
    desc:'사용량을 입력하면<br><strong>잠시 후 자동으로 저장<\/strong>됩니다.<br>바로 저장하려면 저장하기 버튼을 눌러주세요.',
    body:'save'
  });

  renderTutorial();
}

function renderTutorial(){
  if(_tutEl)_tutEl.remove();
  _tutEl=document.createElement('div');
  _tutEl.className='tut-overlay';
  var s=_tutSteps[_tutStep];
  var total=_tutSteps.length;
  var isFirst=_tutStep===0;
  var isLast=_tutStep===total-1;

  var h='<div class="tut-box">';
  // Dots
  h+='<div class="tut-dots">';
  for(var i=0;i<total;i++){
    var cls='tut-dot';
    if(i===_tutStep)cls+=' active';
    else if(i<_tutStep)cls+=' done';
    h+='<div class="'+cls+'"><\/div>';
  }
  h+='<\/div>';

  h+='<div class="tut-emoji">'+s.emoji+'<\/div>';
  h+='<div class="tut-title">'+s.title+'<\/div>';
  h+='<div class="tut-desc">'+s.desc+'<\/div>';

  // Body content
  if(s.body==='pw'){
    h+='<div style="text-align:left">';
    h+='<div class="tut-pw-group"><div class="tut-pw-label">새 비밀번호 (4자 이상)<\/div>';
    h+='<input class="tut-pw-input" id="tutPw1" type="password" placeholder="새 비밀번호"><\/div>';
    h+='<div class="tut-pw-group"><div class="tut-pw-label">비밀번호 확인<\/div>';
    h+='<input class="tut-pw-input" id="tutPw2" type="password" placeholder="같은 비밀번호 다시 입력"><\/div>';
    h+='<div id="tutPwError" style="color:var(--error);font-size:13px;min-height:18px;margin:4px 0"><\/div>';
    h+='<button class="tut-pw-btn" onclick="WB.tutChangePw()">비밀번호 변경하기<\/button>';
    h+='<button class="tut-pw-skip" onclick="WB.tutNext()">나중에 할게요 &rarr;<\/button>';
    h+='<\/div>';
  }else if(s.body==='usage'){
    h+='<div class="tut-highlight">';
    h+='<div class="tut-highlight-body">';
    h+='<span class="tut-step-num">1<\/span> <strong>검침 입력<\/strong> 탭에서<br>';
    h+='<span class="tut-step-num">2<\/span> 내 호실 카드의 <strong>톤수 칸<\/strong>에 숫자 입력<br>';
    h+='<span class="tut-step-num">3<\/span> 계량기 <strong>사진 촬영<\/strong>도 가능해요';
    h+='<\/div><\/div>';
    h+='<div class="tut-highlight tut-warn">';
    h+='<div class="tut-highlight-title">&#128161; 꿀팁<\/div>';
    h+='<div class="tut-highlight-body">수도 검침표에 적힌 <strong>톤수<\/strong>만<br>그대로 입력하면 돼요!<\/div>';
    h+='<\/div>';
  }else if(s.body==='schedule'){
    h+='<div class="tut-highlight">';
    h+='<div class="tut-highlight-body">';
    h+='<span class="tut-step-num">1<\/span> 매월 <strong>26일<\/strong>에 계량기 사진 촬영<br>';
    h+='<span class="tut-step-num">2<\/span> 사진과 함께 <strong>사용량(톤수)<\/strong> 입력<br>';
    h+='<span class="tut-step-num">3<\/span> <strong>저장<\/strong> 버튼 누르기';
    h+='<\/div><\/div>';
    h+='<div class="tut-highlight tut-warn">';
    h+='<div class="tut-highlight-title">&#128161; 왜 26일인가요?<\/div>';
    h+='<div class="tut-highlight-body">전월 27일 ~ 이번달 26일까지의<br>사용량이 다음달에 청구됩니다.<br><br>';
    h+='<strong>예시)<\/strong> 8/27~9/26 사용분 &rarr; <strong>10월 청구<\/strong><\/div>';
    h+='<\/div>';
  }else if(s.body==='save'){
    h+='<div class="tut-highlight">';
    h+='<div class="tut-highlight-body" style="text-align:center;font-size:16px">';
    h+='숫자를 입력하면<br><strong style="font-size:18px;color:var(--blue)">자동으로 저장<\/strong>됩니다<br><br>';
    h+='<span style="font-size:14px;color:var(--text-secondary)">급하면 저장하기 버튼을 눌러도 돼요<\/span>';
    h+='<\/div><\/div>';
  }

  // Navigation
  if(s.body!=='pw'){
    h+='<div class="tut-nav">';
    if(!isFirst)h+='<button class="tut-nav-btn tut-nav-prev" onclick="WB.tutPrev()">이전<\/button>';
    if(isLast){
      h+='<button class="tut-nav-btn tut-nav-done" onclick="WB.tutDone()">시작하기!<\/button>';
    }else{
      h+='<button class="tut-nav-btn tut-nav-next" onclick="WB.tutNext()">다음<\/button>';
    }
    h+='<\/div>';
  }

  h+='<\/div>';
  _tutEl.innerHTML=h;
  document.body.appendChild(_tutEl);
}

WB.tutNext=function(){
  if(_tutStep<_tutSteps.length-1){_tutStep++;renderTutorial()}
};
WB.tutPrev=function(){
  if(_tutStep>0){_tutStep--;renderTutorial()}
};
WB.tutDone=function(){
  if(_tutEl)_tutEl.remove();_tutEl=null;
  if(_tutUnit){
    if(!state.settings.tutorialSeen)state.settings.tutorialSeen={};
    state.settings.tutorialSeen[_tutUnit]=true;
    dirty=true;
  }
  if(_tutPwChanged){
    showToast('비밀번호가 변경되었습니다!');
  }else{
    showToast('도움이 필요하면 상단 ? 버튼을 눌러주세요');
  }
};
WB.tutChangePw=async function(){
  var pw1El=document.getElementById('tutPw1');
  var pw2El=document.getElementById('tutPw2');
  var errEl=document.getElementById('tutPwError');
  if(!pw1El||!pw2El)return;
  var pw1=pw1El.value,pw2=pw2El.value;
  if(!pw1){errEl.textContent='비밀번호를 입력해주세요';return}
  if(pw1.length<4){errEl.textContent='4자 이상 입력해주세요';return}
  if(pw1!==pw2){errEl.textContent='비밀번호가 다릅니다';return}
  var h=await hashPw(pw1);
  if(!state.settings.unitPasswords)state.settings.unitPasswords={};
  state.settings.unitPasswords[_tutUnit]=h;
  _tutPwChanged=true;
  dirty=true;
  // Save immediately so password isn't lost if page closes
  await publishState();
  // Move to next step automatically
  _tutStep++;renderTutorial();
  showToast('비밀번호가 변경되었습니다!');
};
WB.showHelp=function(){
  var unit=(auth&&auth.type==='unit')?auth.unit:null;
  showTutorial(unit,true);
};

initFirebase();

setTimeout(showInstallBanner,3000);
})();
